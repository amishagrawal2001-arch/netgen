# Build a self-contained server tarball for v0.5.0+.
#
# Background — operator-reported pattern across v0.4.x:
#   "different servers fail at different install points"
#
# Each fresh install on a different host kept hitting NEW failure
# modes: PEP 668, virtual `netcat` package, deps-pass silent no-op,
# python-version mismatch. The system-pip surface is too wide and
# too distro-version-dependent to ever be reliable for wider
# distribution.
#
# This workflow builds a NEW distribution artifact that's
# self-contained: a tarball with a bundled Python interpreter
# (from python-build-standalone), a pre-built venv with the wheel
# + all dependencies installed, plus the install/upgrade/uninstall
# scripts. End users extract and run `bin/netgen-install` — no
# system pip ever touched.
#
# This Phase 1a workflow only PRODUCES the tarball and verifies it
# extracts + imports cleanly. Attaching to the GH release + wiring
# into the GUI's Install/Upgrade Server tab come in Phase 2.
#
# The wheel SURVIVES this change — it's still the artifact for
# routine upgrades (pip install inside the bundled venv). Tarball
# is just for fresh installs and major-version migrations.

name: build-server-tarball

# Phase 1a: manual trigger only. Once the build is proven on Noble
# we'll wire it into release.yml so v0.5.0+ tags produce the
# tarball as a release asset alongside the wheel.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to bake into the tarball (defaults to pyproject.toml value)'
        required: false
        type: string
        default: ''
  # v0.5.187: re-added the tag-based auto-trigger. Operator hit the
  # "release page has no tarball" gap on 2026-07-12 while walking a
  # fresh Ubuntu install through the install guide, which references
  # the tarball path as the recommended flow.
  #
  # v0.5.22's "skip tarball on wheel-only releases" rationale is
  # still valid, but the failure mode of "operator follows the docs
  # and the file doesn't exist" outweighs the ~5 min extra CI +
  # ~196 MB storage per tag.
  #
  # Note: paths-filter applies to BOTH branch- and tag-pushes on the
  # same `push:` event per GH docs. To keep tag pushes unconditional
  # (they should ALWAYS produce a tarball) while keeping branch
  # pushes path-filtered, we drop the branch-paths combo and let
  # branch pushes trigger unconditionally too. Dev-time noise from
  # branch pushes stays cheap — the workflow's own concurrency group
  # cancels an in-flight run when a new push lands.
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'

# v0.5.187: cancel any in-flight tarball build on the same ref when
# a newer push lands. Keeps rapid dev-time branch pushes cheap
# (only the newest survives), while tag pushes always run to
# completion because tag refs never re-fire.
concurrency:
  group: build-server-tarball-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # python-build-standalone — pinned to a known-good build. These
  # tarballs are designed for embedding: portable across glibc
  # versions, ship their own libs, no system-Python coupling.
  # Pin to a specific dated release so the build is reproducible —
  # do NOT use "latest" which would pull a new Python every CI run.
  #
  # Source: https://github.com/astral-sh/python-build-standalone
  # We pick the `install_only` flavor (full Python, optimized for
  # embedding) over `full` (which includes debug + headers).
  #
  # 3.10.14 to match the existing installer's choice of Python 3.10.
  # Bumping the Python minor is a separate decision — it would
  # require operators to re-run a full tarball install (their
  # existing wheel-based upgrades wouldn't carry forward to a
  # different Python).
  PBS_PYTHON_VERSION: '3.10.14'
  PBS_RELEASE_DATE: '20240415'

jobs:

  # ─────────────────────────────────────────────────────────────────
  # Build the tarball
  # ─────────────────────────────────────────────────────────────────
  tarball:
    name: Server tarball (linux-x86_64)
    # ubuntu-22.04 over 24.04 deliberately: building against older
    # glibc produces a tarball that works on BOTH 22.04 and 24.04+
    # (forward-compatible). Building on 24.04 would lock out Jammy.
    # python-build-standalone Pythons are largely glibc-independent
    # but our install script + DPDK build step still link against
    # host glibc, so we keep the older floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Build the wheel first — the tarball INCLUDES it (pre-
      # installed into the bundled venv). We deliberately don't
      # download a previously-published wheel here: the tarball must
      # be self-consistent within one CI run.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/

      - name: Resolve version
        id: ver
        run: |
          # Honor manual override; otherwise parse pyproject.toml.
          # Same logic install_ostg_complete.py uses at runtime, in
          # shell. Single source of truth (pyproject.toml) avoids
          # the historical "wheel built as X.Y.Z but installer
          # looked for A.B.C" class of bug.
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -E '^version *= *' pyproject.toml | head -1 \
              | sed -E 's/version *= *"([^"]+)".*/\1/')
          fi
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version from pyproject.toml or inputs"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # ─────────────────────────────────────────────────── bundled Python
      # python-build-standalone ships portable Python interpreters
      # designed for embedding. No system Python is touched.
      - name: Download python-build-standalone
        run: |
          set -euo pipefail
          mkdir -p staging
          cd staging
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_DATE}/cpython-${PBS_PYTHON_VERSION}+${PBS_RELEASE_DATE}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          echo "Fetching: $URL"
          curl -fSL "$URL" -o python-standalone.tar.gz
          ls -la python-standalone.tar.gz
          # The archive extracts to a `python/` directory by design.
          tar -xzf python-standalone.tar.gz
          ls -la python/bin/
          # Sanity: the bundled Python must run before we go further.
          ./python/bin/python3 --version

      # ─────────────────────────────────────────────────── tarball layout
      - name: Assemble tarball directory tree
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.VERSION }}"
          ROOT="netgen-server-${VERSION}"
          mkdir -p "$ROOT"

          # 1. Bundled Python — moves out of `staging/` into final
          #    place. Symlinks inside the Python tree are preserved
          #    by `mv` (they're relative).
          mv staging/python "$ROOT/python-runtime"

          # 2. Pre-built venv pointing at the bundled Python. The
          #    venv's pip + ostg-server entry point go here.
          "$ROOT/python-runtime/bin/python3" -m venv "$ROOT/netgen-venv"
          # Verify the venv links back to the bundled Python (not the
          # CI runner's /usr/bin/python3). This is the whole point.
          VENV_PY_TARGET=$(readlink -f "$ROOT/netgen-venv/bin/python")
          echo "Venv python -> $VENV_PY_TARGET"
          case "$VENV_PY_TARGET" in
            *netgen-server*/python-runtime/bin/*) ;;
            *)
              echo "ERROR: venv's python points outside the bundled runtime."
              echo "Expected target inside $ROOT/python-runtime/bin/"
              exit 1
              ;;
          esac

          # 2b. RELOCATE the venv internals — v0.5.7 fix for srv06.
          #     `python -m venv` writes ABSOLUTE paths into:
          #       - pyvenv.cfg's `home = ...` (used by Python at
          #         startup to find sys.prefix → site-packages)
          #       - bin/python3 symlink target (used as the
          #         interpreter for the shebang chain)
          #     Both end up pointing at the CI runner's filesystem
          #     (/home/runner/work/...). On the operator's host
          #     those paths don't exist, so:
          #       sudo /opt/netgen-server/bin/netgen-install
          #       → shebang #!/opt/netgen-server/netgen-venv/bin/python
          #       → resolves to /opt/netgen-server/netgen-venv/bin/python3
          #       → symlink target /home/runner/work/... missing
          #       → kernel reports "No such file or directory"
          #       → operator-reported on srv06 with v0.5.6 tarball.
          #
          #     Fix shape:
          #       - Symlinks → relative paths (`../../python-runtime/
          #         bin/python3`). Works at any install location.
          #       - pyvenv.cfg → bake `/opt/netgen-server` since that
          #         IS the documented install location; the round-
          #         trip test below verifies it.
          FINAL_PREFIX="/opt/netgen-server"
          echo "Relocating venv to bake-in install prefix: $FINAL_PREFIX"
          # pyvenv.cfg must be an absolute path — `home` is consulted
          # by Python at startup, before any chdir.
          sed -i "s|^home = .*|home = ${FINAL_PREFIX}/python-runtime/bin|" \
            "$ROOT/netgen-venv/pyvenv.cfg"
          echo "Rewrote pyvenv.cfg:"
          cat "$ROOT/netgen-venv/pyvenv.cfg"
          # Replace absolute symlinks with relative ones so the venv
          # is portable enough for the round-trip test to catch any
          # remaining absolute-path leaks.
          for link_name in python3 python3.10 python; do
            link="$ROOT/netgen-venv/bin/$link_name"
            [ -L "$link" ] || continue
            target=$(readlink "$link")
            case "$target" in
              /*)
                # Absolute target — convert to relative.
                # All three names end up pointing at the same
                # bundled python3, just through different symlink
                # chains. ../../python-runtime/bin/python3 resolves
                # to <wherever-extracted>/python-runtime/bin/python3.
                rm "$link"
                ln -s "../../python-runtime/bin/python3" "$link"
                echo "Relinked $link_name → ../../python-runtime/bin/python3"
                ;;
              *)
                # Already relative (e.g. `python -> python3`); leave
                # alone.
                echo "Left $link_name relative: → $target"
                ;;
            esac
          done
          # Sanity check: every symlink in bin/ must now be either
          # a relative one OR resolve to an existing file relative
          # to the venv. No leftover absolute /home/runner paths.
          for link in "$ROOT/netgen-venv/bin/python" "$ROOT/netgen-venv/bin/python3" "$ROOT/netgen-venv/bin/python3.10"; do
            [ -L "$link" ] || continue
            tgt=$(readlink "$link")
            case "$tgt" in
              /*) echo "ERROR: $link still absolute: $tgt"; exit 1 ;;
            esac
          done

          # 3. Install the wheel + deps into the venv. --no-cache-dir
          #    keeps the venv reproducible; --force-reinstall has the
          #    same rationale as install_ostg_complete.py:install_ostg
          #    (v0.4.8 fix) — guarantee pip re-resolves the dep
          #    graph instead of no-op'ing on a pre-existing entry.
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Installing wheel: $WHEEL"
          "$ROOT/netgen-venv/bin/pip" install --no-cache-dir --upgrade pip
          "$ROOT/netgen-venv/bin/pip" install --no-cache-dir --force-reinstall "$WHEEL"

          # 3b. v0.5.12 fix: rewrite ALL CI-runner shebangs in
          # netgen-venv/bin/* to point at the relocated install path.
          #
          # pip writes console_scripts entry points with the absolute
          # path of whichever python created the venv:
          #
          #   $ head -1 netgen-venv/bin/ostg-server
          #   #!/home/runner/work/netgen/netgen/netgen-server-X.Y.Z/
          #     netgen-venv/bin/python3
          #
          # On the operator's host that path doesn't exist. systemd
          # tries ExecStart=.../netgen-venv/bin/ostg-server, the
          # kernel loads the script, reads the shebang, fails to
          # exec /home/runner/... — reports:
          #
          #   ostg-server: No such file or directory
          #   exit-code 203/EXEC
          #
          # Operator-reported on srv06 (v0.5.11) — netgen-install's
          # _verify_running() diagnostic dump caught it:
          #
          #   journalctl shows: Failed to execute /opt/netgen-server/
          #     netgen-venv/bin/ostg-server: No such file or directory
          #
          # v0.5.7 fixed the shebang for bin/netgen-install (and
          # netgen-upgrade, netgen-uninstall) at step 5 below — but
          # NOT for the dozens of entry-point scripts pip drops in
          # netgen-venv/bin/ (ostg-server, ostg-client, netgen-cli,
          # ostg-docker-install, pip, pip3, flask, etc.). All of
          # those had CI-runner shebangs.
          #
          # Same fix shape as v0.5.7: rewrite to the canonical
          # /opt/netgen-server/netgen-venv/bin/python (which is
          # already a relative symlink to ../../python-runtime/bin/
          # python3 thanks to v0.5.7, so it resolves at any extract
          # location).
          echo "Rewriting CI-runner shebangs in netgen-venv/bin/* ..."
          REWROTE=0
          for script in "$ROOT/netgen-venv/bin"/*; do
            [ -f "$script" ] || continue
            [ -L "$script" ] && continue
            # Read first 4 bytes; bail if not a #! script.
            head -c 2 "$script" 2>/dev/null | grep -q '^#!' || continue
            shebang=$(head -1 "$script")
            case "$shebang" in
              *netgen-server-*/netgen-venv/bin/python*)
                sed -i '1s|.*|#!/opt/netgen-server/netgen-venv/bin/python|' "$script"
                REWROTE=$((REWROTE + 1))
                ;;
            esac
          done
          echo "  rewrote $REWROTE script shebangs"
          # Verify NO scripts left with CI-runner shebangs.
          LEAKED=$(
            grep -l '^#!/home/runner' "$ROOT/netgen-venv/bin"/* 2>/dev/null || true
          )
          if [ -n "$LEAKED" ]; then
            echo "ERROR: scripts still have CI-runner shebangs after rewrite:"
            echo "$LEAKED" | while read -r f; do
              echo "  $(basename "$f"): $(head -1 "$f")"
            done
            exit 1
          fi
          echo "  no CI-runner paths leaked through"

          # 4. Resources + Docker assets that the runtime expects.
          #
          # v0.5.10 fix: PRESERVE the `resources/` parent dir, not
          # just dpdk. netgen-install's preflight check (and the
          # runtime's hardcoded paths) expect
          # `share/netgen/resources/dpdk/...`, not
          # `share/netgen/dpdk/...`. Operator-reported on srv06:
          #
          #   [ERROR] Install root /opt/netgen-server is missing
          #     expected files:
          #   [ERROR] - /opt/netgen-server/share/netgen/resources/dpdk
          #   [client] installer exit rc=3
          #
          # Latent since v0.5.0. CI never caught it because the
          # smoke test runs netgen-install but it bails on
          # `_require_root()` before reaching the layout check —
          # the missing path was only visible at first real install.
          mkdir -p "$ROOT/share/netgen/resources"
          cp -r resources/dpdk "$ROOT/share/netgen/resources/"
          cp -r ostg_docker "$ROOT/share/netgen/"
          cp Dockerfile.frr "$ROOT/share/netgen/"

          # 5. Phase 2: install/upgrade/uninstall scripts. These live
          #    in scripts/tarball/ in the source tree and get copied
          #    into bin/ in the tarball. Shebangs are rewritten to
          #    point at the BUNDLED venv's Python so the scripts run
          #    against the tarball's interpreter, not whatever the
          #    operator's system has installed.
          mkdir -p "$ROOT/bin"
          for script in netgen-install netgen-upgrade netgen-uninstall; do
            src="scripts/tarball/$script"
            dst="$ROOT/bin/$script"
            if [ ! -f "$src" ]; then
              echo "ERROR: $src missing from source tree"
              exit 1
            fi
            cp "$src" "$dst"
            chmod 0755 "$dst"
            # v0.5.256 fix: the pre-v0.5.256 rewrite baked in the
            # absolute path `#!/opt/netgen-server/netgen-venv/bin/
            # python`. That works when — and only when — the operator
            # extracts the tarball to /opt/netgen-server, per the
            # README. But operators routinely extract to /tmp first
            # (permissions test, staging, or the README's `-C /opt`
            # command silently succeeded to a different path), then
            # run `bin/netgen-install` from the extract dir. The
            # kernel reads the shebang, can't find /opt/netgen-server/
            # netgen-venv/bin/python, and reports "No such file or
            # directory" with no helpful clue about where to look.
            #
            # Fix: shell + Python polyglot. Line 1 = `#!/bin/sh`, so
            # the kernel loads sh regardless of install path. Line 2
            # is BOTH a valid shell command (execs the bundled Python
            # found via relative path from THIS script's own dir) AND
            # a valid Python expression (adjacent-concatenated string
            # literals; interpreter is happy). After `exec`, Python
            # reads the file from the top; line 1 is a comment, line
            # 2 is a lone string expression, line 3+ is the real code.
            #
            # Works at ANY extract path — the shim finds its own
            # bundled Python via `$(dirname "$0")/../netgen-venv/bin/
            # python3`. If the operator extracts to /tmp/netgen-server,
            # bin/netgen-install now runs; the Python code then warns
            # about the non-canonical location + writes the systemd
            # unit against wherever they are.
            {
              echo '#!/bin/sh'
              echo '"exec" "$(cd "$(dirname "$0")" && pwd)/../netgen-venv/bin/python3" "$0" "$@"'
              tail -n +2 "$src"  # drop the source's `#!/usr/bin/env python3` shebang
            } > "$dst"
            chmod 0755 "$dst"
            # Sanity check the rewrite landed AND the shim still runs
            # under the bundled Python at the canonical install path.
            head -2 "$dst"
          done

          # 6. README + VERSION stamp so the tarball is self-documenting.
          echo "${VERSION}" > "$ROOT/VERSION"
          cat > "$ROOT/README.txt" <<EOF
          Netgen Traffic Generator — Server Tarball ${VERSION}

          Self-contained bundle:
            python-runtime/   Bundled CPython ${PBS_PYTHON_VERSION} (no system Python required)
            netgen-venv/      Pre-built venv with the wheel + dependencies
            share/netgen/     DPDK, Docker (FRR), and other runtime resources
            bin/              Install + upgrade + uninstall scripts

          Install (Ubuntu 22.04 or 24.04):
            sudo tar -xzf $(basename netgen-server-${VERSION}-linux-x86_64.tar.gz) -C /opt
            sudo mv /opt/netgen-server-${VERSION} /opt/netgen-server
            sudo /opt/netgen-server/bin/netgen-install

          Routine upgrade (wheel-based, ~30 sec):
            sudo /opt/netgen-server/bin/netgen-upgrade ostg_trafficgen-X.Y.Z-py3-none-any.whl

          Uninstall:
            sudo /opt/netgen-server/bin/netgen-uninstall          # leaves install tree
            sudo /opt/netgen-server/bin/netgen-uninstall --purge  # removes everything
          EOF

          # 7. Slim the venv. Operator-relevant artifact size; pre-slim
          #    we were at 690 MB for the venv alone. Three cheap wins:
          #
          #    (a) __pycache__: Python rebuilds .pyc files on first
          #        import. Dropping them shaves ~30-40% of site-packages.
          #    (b) tests/ dirs in site-packages: ship-time noise.
          #        Scapy's tests are ~30 MB on their own.
          #    (c) *.pyc / *.pyo orphans: same as (a).
          #
          #    Pip + setuptools + wheel STAY — netgen-upgrade needs them.
          echo "Pre-slim venv size:"
          du -sh "$ROOT/netgen-venv"
          find "$ROOT/netgen-venv" -type d -name __pycache__ -exec rm -rf {} +
          find "$ROOT/netgen-venv" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete
          find "$ROOT/netgen-venv/lib" -type d -name tests -prune -exec rm -rf {} + || true
          find "$ROOT/netgen-venv/lib" -type d -name test -prune -exec rm -rf {} + || true
          # The venv's include/ is only needed when compiling C ext
          # modules INSIDE the venv (we don't).
          rm -rf "$ROOT/netgen-venv/include" || true
          echo "Post-slim venv size:"
          du -sh "$ROOT/netgen-venv"

          ls -la "$ROOT"
          du -sh "$ROOT"

      # ─────────────────────────────────────────────────── smoke test
      - name: Smoke-test the staged tree
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.VERSION }}"
          ROOT="netgen-server-${VERSION}"

          # The bundled Python must be able to import every core dep
          # — Flask (the server), scapy (the data plane), requests
          # (outbound HTTP), psutil (interface counters in the
          # v0.4.4 /api/interfaces fix). If ANY of these fail to
          # import, the tarball is broken — fail the build.
          echo "Verifying core deps import from the bundled venv..."
          "$ROOT/netgen-venv/bin/python" -c "
          import flask, scapy.all, requests, psutil
          print(f'flask {flask.__version__}')
          print(f'scapy {scapy.__version__}')
          print(f'requests {requests.__version__}')
          print(f'psutil {psutil.__version__}')
          "

          # The wheel's entry point must exist in the venv's bin/
          # (created by pip when it installed the wheel). If this
          # fails the wheel didn't declare its console_scripts or
          # pip didn't run the entry-point creation step.
          echo "Verifying entry points..."
          ls "$ROOT/netgen-venv/bin/" | grep -E '(ostg-server|netgen-cli)'

          # Verify the run_tgen_server module imports without
          # raising — the v0.4.8 san-hp-srv06 bug was that this
          # import failed at startup. If the same kind of bug is
          # already in the tarball, fail loudly here.
          echo "Verifying run_tgen_server is importable..."
          "$ROOT/netgen-venv/bin/python" -c "import run_tgen_server"

          # Verify the install/upgrade/uninstall scripts at least
          # parse + have the rewritten shebang. We can't actually
          # RUN them on the CI runner (they require root + want to
          # write /etc/systemd/...), but we can syntax-check.
          for script in netgen-install netgen-upgrade netgen-uninstall; do
            echo "Syntax-checking bin/$script..."
            "$ROOT/netgen-venv/bin/python" -m py_compile "$ROOT/bin/$script"
            # And confirm the shebang was rewritten to point at the
            # bundled venv (not /usr/bin/env). Without this the
            # rewrite step regression would surface only at the
            # operator's first install.
            grep -q '^#!/opt/netgen-server/netgen-venv/bin/python' \
              "$ROOT/bin/$script" || {
                echo "ERROR: bin/$script shebang not rewritten"
                head -1 "$ROOT/bin/$script"
                exit 1
              }
          done

      # ─────────────────────────────────────────────────── pack tarball
      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.VERSION }}"
          ROOT="netgen-server-${VERSION}"
          OUT="netgen-server-${VERSION}-linux-x86_64.tar.gz"

          # `tar` is fine here; pigz would compress faster but the
          # tarball is built once per release. Use --owner=root and
          # --group=root so the extracted files don't carry the CI
          # runner's UID (which would surface as `1001` on the
          # target — operator-confusing).
          #
          # v0.5.9 fix: bake a HARDCODED PAST mtime into every header.
          #
          # v0.5.8 used SOURCE_DATE_EPOCH = git commit time. That's the
          # reproducible-builds standard, BUT it has a fatal flaw for
          # our threat model: the commit time IS "now" at release-cut
          # time. An operator retrying within minutes of the release
          # being cut, on a host whose clock is drifted seconds behind
          # UTC, STILL sees the mtimes as "in the future".
          #
          # Operator-reported sequence demonstrating this:
          #
          #   v0.5.8 released at 08:16 UTC (commit time).
          #   srv06 retried with v0.5.7 client at ~08:16:00 srv06-time
          #     (= ~08:16:15 actual UTC; clock 15 s behind).
          #
          #   tar: python-runtime/.../traceback.py: time stamp
          #        2026-06-07 08:16:04 is 8.018637775 s in the future
          #   ...
          #   [client] installer exit rc=3   ← SAME bug as v0.5.7
          #
          # The fix: hardcode a date FAR in the past. 2020-01-01 UTC
          # works — no modern host clock is behind 2020 unless
          # catastrophically misconfigured (BIOS battery dead AND no
          # NTP), and the project didn't exist before that anyway, so
          # the mtime is meaningless either way.
          #
          # Trade-off vs SOURCE_DATE_EPOCH: we lose per-commit
          # reproducibility (every tarball has the same mtimes,
          # regardless of which commit packed it). But we GAIN
          # unconditional clock-skew safety — which is what operators
          # actually care about. Reproducibility was a side benefit;
          # not-failing-to-install is the primary goal.
          #
          # SOURCE_DATE_EPOCH is still set for compatibility with any
          # tool that consumes it, just not used by tar.
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          # 2020-01-01 00:00:00 UTC = epoch 1577836800
          STABLE_MTIME=1577836800
          echo "Packing tarball with hardcoded past mtime:"
          echo "  STABLE_MTIME=$STABLE_MTIME (= 2020-01-01 00:00:00 UTC)"
          echo "  SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH (exported for tools, not used by tar)"
          tar -czf "$OUT" \
            --owner=root:0 --group=root:0 \
            --mtime="@${STABLE_MTIME}" \
            --sort=name \
            "$ROOT"
          ls -la "$OUT"
          echo "TARBALL=$OUT" >> "$GITHUB_OUTPUT"
          echo "TARBALL_SIZE_MB=$(du -m "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────── round-trip
      - name: Verify tarball extracts cleanly + venv still works
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.VERSION }}"
          TARBALL="netgen-server-${VERSION}-linux-x86_64.tar.gz"
          ROOT="netgen-server-${VERSION}"

          # v0.5.7 fix: delete the staging tree BEFORE the round-trip
          # extract test. The v0.5.6 round-trip false-positively passed
          # because the venv's symlinks were absolute paths into the
          # staging tree (/home/runner/work/netgen/netgen/netgen-server-
          # 0.5.6/python-runtime/bin/python3). When the test extracted
          # to /tmp/tarball-roundtrip and tried to run the venv python,
          # the symlink resolved via the LEFTOVER staging tree on the
          # CI filesystem — not via the extracted /tmp/ copy. Looked
          # green; operator-broken.
          #
          # By deleting the staging tree first, the only thing on disk
          # is the tarball. The test becomes representative.
          echo "Deleting staging tree to prevent symlink-leakage false-positive:"
          rm -rf "$ROOT"
          rm -rf staging
          ls -la

          # Extract to /opt/netgen-server — the DOCUMENTED install
          # path. pyvenv.cfg's `home = /opt/netgen-server/python-
          # runtime/bin` is now baked in (step 2b above), so this is
          # the path that must work end-to-end.
          sudo mkdir -p /opt/netgen-server
          sudo tar --strip-components=1 -xzf "$TARBALL" -C /opt/netgen-server
          sudo chown -R "$USER:$USER" /opt/netgen-server || true
          EXTRACTED="/opt/netgen-server"

          # Verify pyvenv.cfg's home now points at the install path.
          # Catches a regression in the step-2b sed rewrite.
          if ! grep -q "^home = /opt/netgen-server/python-runtime/bin" \
                "$EXTRACTED/netgen-venv/pyvenv.cfg"; then
            echo "ERROR: pyvenv.cfg's home was not rewritten to /opt/netgen-server"
            cat "$EXTRACTED/netgen-venv/pyvenv.cfg"
            exit 1
          fi

          # Verify the venv's python3 symlink resolves WITHOUT looking
          # for any /home/runner/* path. This is the smoking-gun test
          # for the v0.5.6 srv06 failure.
          PY3_TARGET=$(readlink "$EXTRACTED/netgen-venv/bin/python3")
          case "$PY3_TARGET" in
            /home/runner/*)
              echo "ERROR: venv/bin/python3 still points at CI runner: $PY3_TARGET"
              exit 1
              ;;
            /*)
              echo "ERROR: venv/bin/python3 is absolute: $PY3_TARGET (expected relative)"
              exit 1
              ;;
          esac
          echo "venv/bin/python3 → $PY3_TARGET (relative ✓)"
          # And it must actually resolve to an existing file.
          if [ ! -x "$EXTRACTED/netgen-venv/bin/python3" ]; then
            echo "ERROR: venv/bin/python3 doesn't resolve to an executable file"
            ls -la "$EXTRACTED/netgen-venv/bin/python3"
            exit 1
          fi

          # Re-run the imports against the EXTRACTED tree. This is
          # what the operator's first invocation would do.
          echo "Re-verifying imports from /opt/netgen-server..."
          "$EXTRACTED/netgen-venv/bin/python" -c "
          import flask, scapy.all, requests, psutil, run_tgen_server
          print('all imports OK from /opt/netgen-server')
          "

          # And — the actual operator-reported failure mode — try to
          # actually EXECUTE bin/netgen-install via its rewritten
          # shebang. It has no --help flag, so we just invoke it
          # without root. Without the v0.5.7 fix, the kernel returns
          # "No such file or directory" because the shebang's python
          # symlink target is missing. With the v0.5.7 fix, the
          # interpreter loads, the script imports, and then exits
          # non-zero on the _require_root() check — which means the
          # shebang chain is intact (success for this test).
          #
          # We expect non-zero exit but with OUTPUT — proves the
          # interpreter ran. If exec(2) itself failed, there'd be
          # no Python-side output at all.
          echo "Smoke-testing bin/netgen-install shebang chain..."
          set +e
          OUTPUT=$("$EXTRACTED/bin/netgen-install" 2>&1)
          RC=$?
          set -e
          echo "exit=$RC output:"
          echo "$OUTPUT"
          if [ "$RC" -eq 127 ] || echo "$OUTPUT" | grep -qi "no such file"; then
            echo "ERROR: shebang chain broken — operator on srv06 reported this exact failure mode"
            exit 1
          fi
          # Must have produced Python-side output (require_root logger
          # message). Empty output = exec(2) silently failed.
          if [ -z "$OUTPUT" ]; then
            echo "ERROR: no output from bin/netgen-install — exec(2) failure"
            exit 1
          fi

          # v0.5.10 fix: verify the layout-check paths exist in the
          # extracted tree. Without this, the missing-path bug from
          # v0.5.0 stays latent until the operator hits root-level
          # preflight. The shebang smoke EXITS at _require_root
          # BEFORE this check, so the preflight never actually
          # validated in CI. Pin the paths explicitly here.
          #
          # Operator-reported on srv06 (v0.5.9):
          #   [ERROR] - /opt/netgen-server/share/netgen/resources/dpdk
          #   [client] installer exit rc=3
          #
          # The CI smoke had been GREEN since v0.5.0.
          echo "Verifying netgen-install's required layout paths exist..."
          for required in \
              "$EXTRACTED/python-runtime/bin/python3" \
              "$EXTRACTED/netgen-venv/bin/ostg-server" \
              "$EXTRACTED/share/netgen/resources/dpdk" \
              "$EXTRACTED/share/netgen/Dockerfile.frr"; do
            if [ ! -e "$required" ]; then
              echo "ERROR: required layout path missing: $required"
              echo "       (netgen-install's _preflight would reject this)"
              exit 1
            fi
          done
          echo "✓ All netgen-install layout paths present"

          # v0.5.11: the FRR Dockerfile's COPY directives reference
          # sibling files. Pin that the build CONTEXT (the dir
          # passed as the last `docker build` argument) actually
          # contains every file the Dockerfile COPYs from.
          #
          # Operator-reported on srv06 (v0.5.10):
          #   [4/7] COPY frr.conf.template /etc/frr/frr.conf.template
          #   ERROR: failed to calculate checksum of ref ...:
          #     "/frr.conf.template": not found
          #
          # netgen-install v0.5.11 uses share/netgen/ostg_docker/
          # as the build context, where Dockerfile + siblings
          # coexist. Verify the layout supports it.
          FRR_CTX="$EXTRACTED/share/netgen/ostg_docker"
          echo "Verifying FRR Docker build context at $FRR_CTX..."
          for f in Dockerfile.frr frr.conf.template start-frr.sh; do
            if [ ! -e "$FRR_CTX/$f" ]; then
              echo "ERROR: FRR build context missing $FRR_CTX/$f"
              echo "       (Dockerfile.frr's COPY $f would fail)"
              exit 1
            fi
          done
          # And derive the list of COPY src filenames from the
          # Dockerfile itself — catches any future addition that
          # references a new sibling. We don't run docker build
          # in CI (would need root for some buildkit setups + 2-3 min
          # of CI time), but pinning the static contract catches the
          # most common regression.
          missing_copies=$(
            grep -E '^\s*COPY\s+\S+\s' "$FRR_CTX/Dockerfile.frr" \
              | awk '{print $2}' \
              | while read -r src; do
                  case "$src" in
                    /*) ;;  # absolute path inside image, skip
                    *)
                      if [ ! -e "$FRR_CTX/$src" ]; then
                        echo "$src"
                      fi
                      ;;
                  esac
                done
          )
          if [ -n "$missing_copies" ]; then
            echo "ERROR: Dockerfile.frr COPY references missing from build context:"
            echo "$missing_copies"
            exit 1
          fi
          echo "✓ FRR Docker build context complete"

          # v0.5.12: verify the systemd ExecStart target shebang
          # resolves. This is the exact path systemd will try to
          # exec — if its shebang interpreter is missing, the
          # service is dead before it ever opens port 5050.
          #
          # Operator-reported on srv06 (v0.5.11):
          #   Failed to execute /opt/netgen-server/netgen-venv/bin/
          #     ostg-server: No such file or directory (203/EXEC)
          #
          # Without this CI gate, the next operator hits the same
          # trap on the next regression.
          echo "Verifying ostg-server shebang resolves..."
          for entry in ostg-server ostg-client netgen-cli ostg-docker-install; do
            f="$EXTRACTED/netgen-venv/bin/$entry"
            [ -f "$f" ] || continue
            shebang=$(head -1 "$f")
            case "$shebang" in
              "#!/home/runner"*)
                echo "ERROR: $entry shebang still points at CI runner:"
                echo "       $shebang"
                exit 1
                ;;
              "#!"*)
                # Verify the interpreter path resolves to an actual
                # executable file from the extracted location.
                interp=${shebang#\#!}
                # Strip any args (e.g. `python -u` → `python`).
                interp=${interp%% *}
                if [ ! -x "$interp" ]; then
                  echo "ERROR: $entry shebang interpreter not executable:"
                  echo "       interpreter: $interp"
                  echo "       shebang:     $shebang"
                  exit 1
                fi
                echo "  ✓ $entry → $interp (executable)"
                ;;
              *)
                echo "ERROR: $entry has no shebang or is not a script"
                exit 1
                ;;
            esac
          done

          # Show the final size profile for sanity.
          du -sh "$EXTRACTED"
          du -sh "$EXTRACTED/python-runtime"
          du -sh "$EXTRACTED/netgen-venv"
          du -sh "$EXTRACTED/share"

          # Leave /opt/netgen-server in place so the next step (pack)
          # doesn't re-extract; the artifact upload uses the original
          # tarball file in the workspace.

      - name: Upload tarball as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-tarball-linux-x86_64
          # Capture both the tarball AND the wheel that produced it
          # — Phase 2 will use the wheel as the upgrade artifact, so
          # keeping them paired makes the relationship clear.
          path: |
            netgen-server-*-linux-x86_64.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

      # Attach the tarball to the GitHub release for v* tag pushes
      # ONLY. The CI-artifact upload above stays in place for
      # workflow_dispatch / branch-push runs so we can grab tarballs
      # for ad-hoc testing without creating a release.
      #
      # softprops/action-gh-release is idempotent: release.yml is
      # ALSO appending its wheel/.dmg/.exe/.AppImage to this same
      # tag, and both workflows run in parallel. softprops handles
      # concurrent appends without clobbering each other's files
      # (they target different filenames). The body_path comment-
      # only mode is intentional — release.yml owns the body.
      - name: Attach tarball to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: netgen-server-*-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          # Don't touch the release body — release.yml's CHANGELOG-
          # driven notes are the authoritative content. We're only
          # adding an asset.
          generate_release_notes: false
          append_body: false

      - name: Summary
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.VERSION }}"
          {
            echo "## Server tarball build summary"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Bundled Python: \`${PBS_PYTHON_VERSION}\` (python-build-standalone ${PBS_RELEASE_DATE})"
            echo "- Tarball: \`${{ steps.pack.outputs.TARBALL }}\` (${{ steps.pack.outputs.TARBALL_SIZE_MB }} MB)"
            echo "- Smoke tests: ✓ imports, ✓ entry points, ✓ run_tgen_server"
            echo "- Round-trip extract: ✓"
            echo
            echo "Download the \`server-tarball-linux-x86_64\` artifact below to test on a real Noble host."
          } >> "$GITHUB_STEP_SUMMARY"
