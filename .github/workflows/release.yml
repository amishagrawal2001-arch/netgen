# Build multi-platform installers and attach to a GitHub release.
#
# Triggers:
#   * Tag push matching v*  →  full release with all 4 artifacts
#   * Manual workflow_dispatch  →  builds without creating a release
#
# Artifacts produced:
#   * ostg_trafficgen-<v>-py3-none-any.whl                 (universal)
#   * Netgen-Client-<v>-windows.exe                        (PyInstaller one-file)
#   * Netgen-TrafficGenerator-<v>.dmg                      (macOS)
#   * Netgen-Client-<v>-linux-x86_64.AppImage              (Linux universal)
#
# Why split across 3 runners: PyInstaller is OS-native and can't
# cross-build. The wheel itself is universal so we only need to
# build it once.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# When several version-bump pushes land in quick succession (e.g.
# v0.2.91 → v0.2.92 → v0.2.93 inside a few minutes during an audit-
# fix burst), cancel the prior in-flight release run instead of
# letting all of them race for the same release artifacts. Saves
# ~50% on burst days. The `cancel-in-progress: true` matters more
# than the group key — every tag push gets the same `release` group
# so a newer push pre-empts an older one regardless of tag name.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true

# v0.3.3: opt every JavaScript action into Node.js 24 BEFORE the
# 16 Sep 2026 forced cutover. GitHub deprecated Node 20 on
# 19 Sep 2025; the per-run warning the workflow has been logging
# since looks like this (one per action):
#   ! Node.js 20 actions are deprecated. … Actions will be forced
#     to run with Node.js 24 by default starting June 16th, 2026.
# We're past June 16, 2026 (the warning continues until full
# removal); flipping this env var now eliminates the warning AND
# de-risks the September forced cutover. Cleaner than chasing per-
# action major-version bumps (checkout@v4 → v5, setup-python@v5 →
# v6, etc.) because the version bumps add API-shape risk while
# this env var is purely a runtime-engine selector. If a specific
# action breaks under Node 24, restore-via-version-bump is the
# fallback — but to date none of our pinned actions have had
# reported incompatibilities.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # ───────────────────────────────────────────────────────────────────
  # 1. Wheel  (universal, runs anywhere — we use Ubuntu for speed)
  # ───────────────────────────────────────────────────────────────────
  build-wheel:
    name: Wheel (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          # Workflow-run artifacts default to 90 days; we only need
          # them long enough for the `release` job to download them
          # in the same workflow run, plus a small buffer for
          # debugging re-runs. 7 days cuts artifact storage ~92%.
          # The release-attached copies (uploaded by softprops in
          # the release job) live independently on the GitHub Release
          # page and are not subject to this retention.
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # 2. macOS .dmg
  # ───────────────────────────────────────────────────────────────────
  # macOS runners are billed at 10× the per-minute rate of Linux ones
  # ($0.08/min vs $0.008/min) on PRIVATE repos. v0.3190ef9 (Apr 2026)
  # added an `if: endsWith(github.ref, '.0')` gate to skip macOS on
  # patch tags and save ~$1.20/release while the fork was private.
  #
  # v0.2.98: that gate is REMOVED now that the fork is PUBLIC —
  # standard-runner compute is free and unlimited on public repos
  # (Linux, Windows, AND macOS). Every tag now ships a .dmg so Mac
  # operators don't have to wait for the next .0 bump to get the
  # latest installer. Trade-off: total release wall-time bumps from
  # ~3 min to ~5 min because macOS is now the slowest job in the
  # parallel set. Cost: $0 (it was $1.20 each on private).
  #
  # If we ever flip back to private, restore the gate. Watching for
  # a `private: true` repo property in CI would be over-engineering —
  # the gate is a one-line restoration.
  build-macos:
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # build_dmg.sh expects ostg_client_env to exist; create one
          # with the runtime deps so PyInstaller can resolve hidden
          # imports during its analysis pass.
          python -m venv ostg_client_env
          source ostg_client_env/bin/activate
          pip install --upgrade pip wheel
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Build DMG
        run: |
          # Tools the script expects on PATH
          brew install create-dmg || true
          source ostg_client_env/bin/activate
          ./build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build_image/*.dmg
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # 3. Windows .exe
  # ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows .exe
        shell: pwsh
        run: |
          .\build_windows.ps1

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Netgen-Client-*-windows.exe
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # 4. Linux .AppImage
  # ───────────────────────────────────────────────────────────────────
  build-appimage:
    name: Linux .AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          # Qt5 plugin deps + fuse for AppImage runtime + libGL for PyQt5
          sudo apt-get install -y \
              libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
              libxkbcommon-x11-0 libgl1 libegl1 fuse libfuse2

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/Netgen-Client-*-linux-*.AppImage
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # 5. Publish release (only on tag push)
  # ───────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub release
    needs: [build-wheel, build-macos, build-windows, build-appimage]
    # By default a SKIPPED `needs:` job propagates to skip the
    # downstream. Conditions:
    #   - always() + !cancelled() so we don't run on cancelled workflows
    #   - tag push (existing guard)
    #   - the three always-on builds must have succeeded
    #   - macOS may be 'success' (now the normal outcome since
    #     v0.2.98 removed the .0-only gate) or 'skipped' (defensive
    #     holdover: if the gate is ever restored, the release job
    #     still publishes the other 3 artifacts without macOS).
    if: |
      always() && !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-wheel.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-appimage.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required to create/update releases
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts directory
        run: |
          # Each upload-artifact lands in its own subdir; flatten so
          # `gh release create *.{whl,dmg,exe,AppImage}` works.
          mkdir -p release-assets
          find artifacts/ -type f \
              \( -name "*.whl" -o -name "*.dmg" \
                 -o -name "*.exe" -o -name "*.AppImage" \) \
              -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate release notes from CHANGELOG
        run: |
          # Pull all 0.2.x sections from CHANGELOG.md as the release body.
          awk '/^## \[0\.2\./{flag=1} /^## \[0\.1\./{flag=0} flag' CHANGELOG.md > release-notes.md
          head -3 release-notes.md

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          # Don't clobber a manually-edited release if one exists for this tag.
          generate_release_notes: false

  prune-old-releases:
    name: Prune old releases
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required to delete releases
    steps:
      - name: Keep only the N most recent releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` needs to know which repo to query. Earlier this job
          # had no checkout step and no --repo flag — `gh release list`
          # returned 0 entries and the prune ran as a no-op. Pass the
          # repo explicitly via the github.repository context so the
          # job works without needing actions/checkout (which would
          # be 95% wasted work for a job that doesn't read repo files).
          REPO: ${{ github.repository }}
          # How many releases to retain on the GitHub Releases page.
          # Older ones get their artifacts deleted (saves storage +
          # cleans up the Releases UI) but their git tags STAY — so
          # `git checkout v0.2.7` still works for historical inspection,
          # the workflow can be re-run against any old tag via
          # `gh workflow run release.yml -r v0.2.7` to rebuild the
          # artifacts on demand.
          KEEP: 4
        run: |
          set -euo pipefail

          # Get all releases sorted newest-first. Skip drafts (in case
          # the operator has a WIP one) and keep prereleases in the
          # rotation too — operator can mark a release prerelease
          # explicitly if they want it retained without counting
          # against the limit.
          mapfile -t all_tags < <(
            gh release list --repo "$REPO" --limit 50 \
              --json tagName,createdAt,isDraft \
              --jq 'sort_by(.createdAt) | reverse | .[] | select(.isDraft|not) | .tagName'
          )

          echo "Found ${#all_tags[@]} releases. Keeping latest $KEEP."
          if [ "${#all_tags[@]}" -le "$KEEP" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          to_delete=("${all_tags[@]:$KEEP}")
          echo "Will delete ${#to_delete[@]} release(s):"
          printf '  %s\n' "${to_delete[@]}"

          for t in "${to_delete[@]}"; do
            echo "Deleting release $t (keeping the git tag)..."
            # --cleanup-tag=false  → tag stays; only the release entry
            # + uploaded artifacts go. Re-creating the release later
            # is one `gh workflow run release.yml -r <tag>` away.
            gh release delete "$t" --repo "$REPO" --yes --cleanup-tag=false \
              || echo "  (delete failed for $t — continuing)"
          done

          echo "Done. Remaining releases:"
          gh release list --repo "$REPO" --limit 20
