[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ostg-trafficgen"
version = "0.5.137"
description = "OSTG Traffic Generator - Advanced Network Traffic Generation with BGP/OSPF Support"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Suraj Sharma", email = "suraj.sharma@example.com" }]
license = {text = "MIT"}
keywords = ["network", "traffic", "generator", "bgp", "ospf", "scapy", "flask", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/surajsharma/ostg-trafficgen"
Repository = "https://github.com/surajsharma/ostg-trafficgen"
Issues = "https://github.com/surajsharma/ostg-trafficgen/issues"
Documentation = "https://github.com/surajsharma/ostg-trafficgen#readme"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
ostg-client = "run_tgen_client:main"
ostg-server = "ostg.server:main"
ostg-docker-install = "setup_docker:main"
netgen-cli = "netgen_cli:main"

[tool.setuptools]
# v0.4.3: also exclude `build*` so successive `python -m build`
# invocations on the same checkout don't nest build/lib/build/lib/
# inside the wheel. CI runners start fresh so don't hit this; local
# dev builds without `rm -rf build/` between runs were ending up
# with 8-level-deep build/lib/ trees inside the published artifact.
packages.find = { exclude = ["backup*", "*.backup.*", "*.tmp", "*.temp", "build*"] }
py-modules = ["multithreaded_traffic_gen", "run_tgen_client", "run_tgen_server", "capture_client", "setup_docker", "netgen_cli"]

[tool.setuptools.package-data]
# NB: `"resources" = ["**/*"]` would recurse into resources/dpdk/ and
# resources/icons/, sweeping in everything regardless of what we set
# on those subpackages. Keep this entry empty/marker-only; the real
# data lives in the subpackages.
"resources" = ["__init__.py"]
"resources.icons" = ["**/*"]
# resources.dpdk: enumerate explicit globs rather than "**/*". The
# tx_worker/build/ subtree is a per-host artifact rebuilt by
# install_dpdk.sh step 6 against the host's libdpdk; shipping a stale
# binary from the dev machine wastes wheel space (~300 KB) and tempts
# anyone debugging to run the wrong tx_worker against the host's DPDK
# ABI. setuptools' exclude-package-data doesn't reliably override a
# `**/*` include, so we whitelist instead.
"resources.dpdk" = [
    "*.sh",
    "__init__.py",
    "tx_worker/*.c",
    "tx_worker/*.h",
    "tx_worker/meson.build",
    # v0.5.105: rx_worker — symmetric DPDK RX counter for line-
    # rate accurate capture. Same whitelist approach as tx_worker:
    # build artifacts (build/) are per-host so don't ship them.
    "rx_worker/*.c",
    "rx_worker/*.h",
    "rx_worker/meson.build",
]
# v0.5.49: bundle netgen-upgrade so the running server can
# self-heal /opt/netgen-server/bin/netgen-upgrade on startup.
# Without this, fixes to the upgrade-driver script (v0.5.45's
# --force-reinstall → --upgrade) never reach an installed
# tarball because pip can't touch files outside the venv.
"resources.tarball" = ["netgen-upgrade", "__init__.py"]
"ostg_docker" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["utils", "traffic_client", "ostg"]
omit = ["venv/*", "build_env/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true